[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donino-link"
version = "0.1.0"
description = "Measured multi-transport tunnel orchestration for two Linux servers"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.4"]

[project.scripts]
donino-link = "donino_link.cli:main"

[tool.setuptools]
packages = ["donino_link"]

[tool.setuptools.package-data]
donino_link = ["web/*", "engines.json", "resources/*"]
