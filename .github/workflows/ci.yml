name: Verify Donino Link
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: donino-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Run the entire Python matrix against the exact portable packages shipped
      # to VPS hosts, including Python 3.10's conditional async-timeout dependency.
      - run: source donino_link/resources/python-runtime.sh && donino_python_runtime "$PWD" && echo "$PWD/venv/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/install-node.sh scripts/rollback.sh scripts/expose-panel.sh
      - run: bash -n donino_link/resources/install-node.sh donino_link/resources/rollback.sh scripts/setup.sh
      - run: bash -n donino_link/resources/platform.sh donino_link/resources/python-runtime.sh
      - run: cmp pyproject.toml donino_link/resources/pyproject.toml
      - run: cmp scripts/install-node.sh donino_link/resources/install-node.sh
      - run: cmp scripts/rollback.sh donino_link/resources/rollback.sh
      - run: python scripts/build-web.py --check
      - run: python scripts/build-standalone.py --output /tmp/install-donino-check.sh && cmp install-donino.sh /tmp/install-donino-check.sh
  transport-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python scripts/test-engines.py --output transport-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-integration-results
          path: transport-results.json
  browser-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install .
      - run: node --check donino_link/resources/browser_bridge.js
      - run: google-chrome --version
      - run: python scripts/test-browser.py --chromium /usr/bin/google-chrome --output browser-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-integration-results
          path: browser-results.json
  panel-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install .
      - run: npm install --no-save playwright@1.62.1
      - run: node scripts/test-ui.cjs
      - run: node scripts/test-responsive-ui.cjs
      - run: DONINO_CHROMIUM=/usr/bin/google-chrome node scripts/test-workspace-ui.cjs
      - run: DONINO_CHROMIUM=/usr/bin/google-chrome python scripts/test-ecosystem-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-ui-results
          path: ui-results/
  native-browser-policy:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-22.04', 'ubuntu-24.04']
    steps:
      - uses: actions/checkout@v4
      - run: sudo --preserve-env=GITHUB_ACTIONS bash scripts/test-native-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-policy-${{ matrix.runner }}
          path: native-browser-results.json
  provision-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:22.10', 'ubuntu:23.04', 'ubuntu:23.10', 'ubuntu:24.04', 'ubuntu:24.10', 'ubuntu:25.04', 'ubuntu:25.10', 'ubuntu:26.04']
    env:
      DONINO_TEST_BASE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install .
      - run: npm install --no-save playwright@1.62.1
      # The runner host is Ubuntu; containers represent several OS versions. Permit
      # unprivileged user namespaces on this disposable CI host so Ubuntu's
      # host-wide AppArmor restriction does not override Debian's sandbox policy.
      # Chromium namespace and seccomp sandboxes stay enabled.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python scripts/test-provision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provision-systemd-results-${{ strategy.job-index }}
          path: |
            provision-results.json
            provision-iran.log
            provision-foreign.log
            ui-role-results/

  ecosystem-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install .
      - run: python scripts/test-ecosystem.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-integration-results
          path: ecosystem-results.json
  vpn-backend-systemd:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-22.04', 'ubuntu-24.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: sudo "$(command -v python)" scripts/test-vpn-backend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-backend-systemd-${{ matrix.runner }}
          path: vpn-backend-results.json
